<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Realtime Follower Counter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #333333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .scratch-header {
      width: 100%;
      background-color: #4d97ff;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header-logo {
      color: #ffffff;
      font-weight: bold;
      font-size: 20px;
      letter-spacing: 0.5px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-box input {
      padding: 6px 12px;
      border: 1px solid #3373cc;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }

    .search-box button {
      padding: 6px 14px;
      background-color: #ffab19;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .search-box button:hover {
      background-color: #e69500;
    }

    .main-container {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 600px;
    }

    .user-avatar {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      border: 3px solid #e0e0e0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      object-fit: cover;
      margin-bottom: 12px;
      display: none;
    }

    .username-display {
      font-size: 28px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .follower-count {
      font-size: 96px;
      font-weight: 900;
      color: #ffab19;
      line-height: 1;
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
      transition: transform 0.2s ease;
    }

    .follower-count.bump {
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); color: #4d97ff; }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 14px;
      color: #888888;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="scratch-header">
    <div class="header-logo">Scratch counter</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ユーザー名を入力...">
      <button onclick="searchUser()">検索</button>
    </div>
  </div>

  <div class="main-container">
    <img id="userAvatar" class="user-avatar" src="" alt="User Avatar">
    <div id="usernameDisplay" class="username-display">ユーザーを検索してください</div>
    <div id="followerCount" class="follower-count">---</div>
    <div id="statusText" class="status-text">上の検索欄からScratchのユーザー名を入力してね</div>
  </div>

  <script>
    let timer = null;
    let currentFollowers = null;

    // WorkerのURLを設定済みです
    const WORKER_URL = "scratchcounter-2.sukuiti.workers.dev/";

    function searchUser() {
      const input = document.getElementById("searchInput").value.trim();
      if (!input) return;
      window.location.hash = input;
    }

    async function handleHashChange() {
      const username = decodeURIComponent(window.location.hash.substring(1)).trim();
      if (!username) return;

      document.getElementById("searchInput").value = username;

      if (timer) clearInterval(timer);
      currentFollowers = null;

      await loadUserData(username);
      timer = setInterval(() => loadUserData(username), 10000);
    }

    async function loadUserData(username) {
      const statusEl = document.getElementById("statusText");
      const countEl = document.getElementById("followerCount");
      const nameEl = document.getElementById("usernameDisplay");
      const avatarEl = document.getElementById("userAvatar");

      if (WORKER_URL.includes("YOUR-WORKER-NAME")) {
        statusEl.textContent = "WORKER_URLが設定されていません。index.htmlを確認してください。";
        return;
      }

      statusEl.textContent = "読み込み中...";

      try {
        const response = await fetch(`${WORKER_URL}?username=${encodeURIComponent(username)}`);
        const data = await response.json();

        if (response.ok) {
          avatarEl.src = `https://uploads.scratch.mit.edu/users/avatars/${username}.png`;
          avatarEl.onerror = () => {
            avatarEl.src = "https://scratch.mit.edu/static/images/default_avatar/avatar_90.png";
          };
          avatarEl.style.display = "block";

          nameEl.textContent = username;

          const newCount = data.followers;
          if (currentFollowers !== null && currentFollowers !== newCount) {
            countEl.classList.remove("bump");
            void countEl.offsetWidth;
            countEl.classList.add("bump");
          }
          currentFollowers = newCount;
          countEl.textContent = newCount.toLocaleString();

          statusEl.textContent = `リアルタイム更新中 (${new Date().toLocaleTimeString()})`;
        } else {
          avatarEl.style.display = "none";
          nameEl.textContent = "ユーザーが見つかりません";
          countEl.textContent = "---";
          statusEl.textContent = data.error || "存在しないユーザーです";
        }
      } catch (e) {
        statusEl.textContent = "通信エラーが発生しました（WorkerのURLを確認してください）";
      }
    }

    window.addEventListener("hashchange", handleHashChange);
    window.addEventListener("load", () => {
      if (window.location.hash) {
        handleHashChange();
      }
    });

    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") searchUser();
    });
  </script>

</body>
</html>
