<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch Realtime Follower Count</title>
  <style>
    body {
      font-family: monospace;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #333;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    input {
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .counter {
      font-size: 80px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 20px;
    }

    .error {
      color: #ff5555;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Scratch Follower Count</h1>
    <div>
      <input type="text" id="username" placeholder="Enter Scratch Username">
      <button onclick="startCount()">Start</button>
    </div>
    
    <div id="user-display" style="margin-top:20px; font-size:20px;"></div>
    <div id="counter" class="counter">0</div>
    <div id="error" class="error"></div>
  </div>

  <script>
    // 確認した Worker の URL を設定済み
    const WORKER_URL = "https://scratchcounter.sukuiti.workers.dev";

    let timer = null;
    let currentCount = 0;

    // URLのハッシュ（#ユーザー名）から自動検索
    window.addEventListener('load', () => {
      const hash = decodeURIComponent(location.hash.substring(1)).trim();
      if (hash) {
        document.getElementById('username').value = hash;
        startCount();
      }
    });

    function startCount() {
      const username = document.getElementById('username').value.trim();
      if (!username) return;

      location.hash = encodeURIComponent(username);
      document.getElementById('user-display').textContent = `@${username}`;
      document.getElementById('error').textContent = '';

      if (timer) clearInterval(timer);

      // 初回取得
      updateCount(username);

      // 3秒ごとに更新
      timer = setInterval(() => {
        updateCount(username);
      }, 3000);
    }

    async function updateCount(username) {
      try {
        const res = await fetch(`${WORKER_URL}/?username=${encodeURIComponent(username)}`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'エラーが発生しました');
        }

        animateValue(currentCount, data.followers, 500);
        currentCount = data.followers;

      } catch (err) {
        document.getElementById('error').textContent = err.message;
      }
    }

    // カウントの数字アニメーション
    function animateValue(start, end, duration) {
      if (start === end) {
        document.getElementById('counter').textContent = end.toLocaleString();
        return;
      }

      const range = end - start;
      let startTime = null;

      function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const value = Math.floor(start + range * progress);
        
        document.getElementById('counter').textContent = value.toLocaleString();

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          document.getElementById('counter').textContent = end.toLocaleString();
        }
      }

      requestAnimationFrame(step);
    }
  </script>
</body>
</html>
